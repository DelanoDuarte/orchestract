{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<div class="flex flex-col gap-6">
  <div class="flex flex-col items-center gap-3 text-center">
    <span class="{{ 'text-destructive' if is_error else 'text-primary' }}">
      {{ icon('circle-x' if is_error else 'mail', 'size-8') }}
    </span>
    <h1 class="text-2xl font-semibold tracking-tight">{{ heading }}</h1>
    <p class="text-muted-foreground">{{ message }}</p>
  </div>

  {% if action_href %}
  <a href="{{ action_href }}" class="btn w-full">{{ action_label }}</a>
  {% endif %}
</div>
{% endblock %}
