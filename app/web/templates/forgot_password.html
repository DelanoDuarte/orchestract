{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="flex flex-col gap-6">
  <div class="flex flex-col items-center gap-3 text-center">
    <span class="text-primary">{{ icon('lock', 'size-8') }}</span>
    <h1 class="text-2xl font-semibold tracking-tight">Reset your password</h1>
    <p class="text-muted-foreground">Enter your email and we'll send you a reset link.</p>
  </div>

  <div class="card" data-size="sm">
    <section>
      <form method="post" action="/forgot-password" class="flex flex-col gap-4">
        <div role="group" class="field">
          <label for="forgot-email">Email</label>
          <input id="forgot-email" type="email" name="email" required autofocus>
        </div>
        <button type="submit" class="btn w-full">Send reset link</button>
      </form>
    </section>
  </div>

  <p class="text-center text-sm text-muted-foreground">
    <a href="/login" class="text-primary hover:underline">Back to sign in</a>
  </p>
</div>
{% endblock %}
