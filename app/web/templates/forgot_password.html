{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="reveal mx-auto flex w-full max-w-sm flex-col gap-6 py-6 sm:py-12">
  <div class="flex flex-col items-center gap-3 text-center">
    <span class="icon-chip size-11">{{ icon('lock', 'size-5') }}</span>
    <div class="space-y-1">
      <h1 class="page-title">Reset your password</h1>
      <p class="text-sm text-muted-foreground">Enter your email and we'll send you a reset link.</p>
    </div>
  </div>

  <div class="card p-6">
    <form method="post" action="/forgot-password" class="flex flex-col gap-4" hx-boost="false">
      <div role="group" class="field">
        <label for="forgot-email">Email</label>
        <input id="forgot-email" type="email" name="email" required autofocus placeholder="you@company.com">
      </div>
      <button type="submit" class="btn w-full">Send reset link</button>
    </form>
  </div>

  <p class="text-center text-sm text-muted-foreground">
    <a href="/login" class="font-medium text-primary hover:underline" hx-boost="false">Back to sign in</a>
  </p>
</div>
{% endblock %}
