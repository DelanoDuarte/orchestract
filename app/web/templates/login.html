{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="flex flex-col gap-6">
  <div class="flex flex-col items-center gap-3 text-center">
    <span class="text-primary">{{ icon('zap', 'size-8') }}</span>
    <h1 class="text-2xl font-semibold tracking-tight">Orchestract</h1>
    <p class="text-muted-foreground">Sign in to continue.</p>
  </div>

  {% if error %}
  <div class="alert" data-variant="destructive"><section>{{ error }}</section></div>
  {% endif %}

  <div class="card" data-size="sm">
    <section>
      <form method="post" action="/login" class="flex flex-col gap-4">
        <input type="hidden" name="next" value="{{ next }}">
        <div role="group" class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" name="email" required autofocus>
        </div>
        <div role="group" class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" name="password" required>
        </div>
        <button type="submit" class="btn w-full">Sign in</button>
      </form>
    </section>
  </div>
</div>
{% endblock %}
