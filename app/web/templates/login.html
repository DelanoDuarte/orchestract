{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="flex flex-col gap-6">
  <div class="flex flex-col items-center gap-3 text-center">
    <span class="text-primary">{{ icon('zap', 'size-8') }}</span>
    <h1 class="text-2xl font-semibold tracking-tight">Orchestract</h1>
    <p class="text-muted-foreground">Sign in to continue.</p>
  </div>

  {% if error %}
  <div class="alert" data-variant="destructive">
    <section>
      {{ error }}
      {% if unverified_email %}
      <form method="post" action="/verify-email/resend" class="mt-2">
        <input type="hidden" name="email" value="{{ unverified_email }}">
        <button type="submit" class="btn" data-variant="outline" data-size="sm">Resend verification email</button>
      </form>
      {% endif %}
    </section>
  </div>
  {% endif %}

  <div class="card" data-size="sm">
    <section>
      <form method="post" action="/login" class="flex flex-col gap-4">
        <input type="hidden" name="next" value="{{ next }}">
        <div role="group" class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" name="email" required autofocus>
        </div>
        <div role="group" class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" name="password" required>
        </div>
        <button type="submit" class="btn w-full">Sign in</button>
      </form>
    </section>
  </div>

  <div class="flex flex-col items-center gap-1 text-sm text-muted-foreground">
    <a href="/forgot-password" class="text-primary hover:underline">Forgot password?</a>
    <p>Don't have an account? <a href="/signup" class="text-primary hover:underline">Sign up</a></p>
  </div>
</div>
{% endblock %}
