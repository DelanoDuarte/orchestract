{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="flex flex-col gap-6">
  <div class="flex flex-col items-center gap-3 text-center">
    <span class="text-primary">{{ icon('lock', 'size-8') }}</span>
    <h1 class="text-2xl font-semibold tracking-tight">Choose a new password</h1>
  </div>

  {% if error %}
  <div class="alert" data-variant="destructive"><section>{{ error }}</section></div>
  {% endif %}

  <div class="card" data-size="sm">
    <section>
      <form method="post" action="/reset-password?token={{ token }}" class="flex flex-col gap-4">
        <div role="group" class="field">
          <label for="reset-password">New password</label>
          <input id="reset-password" type="password" name="new_password" required minlength="8" autofocus>
        </div>
        <button type="submit" class="btn w-full">Reset password</button>
      </form>
    </section>
  </div>
</div>
{% endblock %}
