{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="reveal mx-auto flex w-full max-w-sm flex-col gap-6 py-6 sm:py-12">
  <div class="flex flex-col items-center gap-3 text-center">
    <span class="icon-chip size-11">{{ icon('lock', 'size-5') }}</span>
    <div class="space-y-1">
      <h1 class="page-title">Choose a new password</h1>
      <p class="text-sm text-muted-foreground">Make it at least 8 characters.</p>
    </div>
  </div>

  {% if error %}
  <div class="alert" data-variant="destructive"><section>{{ error }}</section></div>
  {% endif %}

  <div class="card p-6">
    <form method="post" action="/reset-password?token={{ token }}" class="flex flex-col gap-4" hx-boost="false">
      <div role="group" class="field">
        <label for="reset-password">New password</label>
        <input id="reset-password" type="password" name="new_password" required minlength="8" autofocus placeholder="••••••••">
      </div>
      <button type="submit" class="btn w-full">Reset password</button>
    </form>
  </div>
</div>
{% endblock %}
