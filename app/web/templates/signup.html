{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="reveal mx-auto flex w-full max-w-sm flex-col gap-6 py-6 sm:py-12">
  <div class="flex flex-col items-center gap-3 text-center">
    <img src="/static/logos/orchestract-mark-light.svg" alt="Orchestract" class="size-11 dark:hidden">
    <img src="/static/logos/orchestract-mark-dark.svg" alt="Orchestract" class="hidden size-11 dark:block">
    <div class="space-y-1">
      <h1 class="page-title">Create your organization</h1>
      <p class="text-sm text-muted-foreground">Start free — no credit card required.</p>
    </div>
  </div>

  {% if error %}
  <div class="alert" data-variant="destructive"><section>{{ error }}</section></div>
  {% endif %}

  <div class="card p-6">
    <form method="post" action="/signup" class="flex flex-col gap-4" hx-boost="false">
      <input type="hidden" name="plan" value="{{ plan or '' }}">
      <div role="group" class="field">
        <label for="signup-org">Organization name</label>
        <input id="signup-org" type="text" name="organization_name" required autofocus value="{{ organization_name or '' }}" placeholder="Acme Corp">
      </div>
      <div role="group" class="field">
        <label for="signup-name">Your name</label>
        <input id="signup-name" type="text" name="user_name" required value="{{ user_name or '' }}" placeholder="Jane Doe">
      </div>
      <div role="group" class="field">
        <label for="signup-email">Email</label>
        <input id="signup-email" type="email" name="email" required value="{{ email or '' }}" placeholder="you@company.com">
      </div>
      <div role="group" class="field">
        <label for="signup-password">Password</label>
        <input id="signup-password" type="password" name="password" required minlength="8" placeholder="At least 8 characters">
      </div>
      <label class="flex items-start gap-2 text-sm font-normal text-muted-foreground">
        <input type="checkbox" name="accept_terms" value="yes" required class="mt-0.5">
        <span>
          I have read and agree to the
          <a href="/terms" target="_blank" class="font-medium text-primary hover:underline" hx-boost="false">Terms &amp; Conditions</a>,
          including how my organization's documents and contracts are stored.
        </span>
      </label>
      <button type="submit" class="btn w-full">Create account</button>
    </form>
  </div>

  <p class="text-center text-sm text-muted-foreground">
    Already have an account? <a href="/login" class="font-medium text-primary hover:underline" hx-boost="false">Sign in</a>
  </p>
</div>
{% endblock %}
