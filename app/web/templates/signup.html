{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="flex flex-col gap-6">
  <div class="flex flex-col items-center gap-3 text-center">
    <span class="text-primary">{{ icon('zap', 'size-8') }}</span>
    <h1 class="text-2xl font-semibold tracking-tight">Create your organization</h1>
    <p class="text-muted-foreground">Start free -- no credit card required.</p>
  </div>

  {% if error %}
  <div class="alert" data-variant="destructive"><section>{{ error }}</section></div>
  {% endif %}

  <div class="card" data-size="sm">
    <section>
      <form method="post" action="/signup" class="flex flex-col gap-4">
        <input type="hidden" name="plan" value="{{ plan or '' }}">
        <div role="group" class="field">
          <label for="signup-org">Organization name</label>
          <input id="signup-org" type="text" name="organization_name" required autofocus value="{{ organization_name or '' }}">
        </div>
        <div role="group" class="field">
          <label for="signup-name">Your name</label>
          <input id="signup-name" type="text" name="user_name" required value="{{ user_name or '' }}">
        </div>
        <div role="group" class="field">
          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" name="email" required value="{{ email or '' }}">
        </div>
        <div role="group" class="field">
          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" name="password" required minlength="8">
        </div>
        <button type="submit" class="btn w-full">Create account</button>
      </form>
    </section>
  </div>

  <p class="text-center text-sm text-muted-foreground">
    Already have an account? <a href="/login" class="text-primary hover:underline">Sign in</a>
  </p>
</div>
{% endblock %}
