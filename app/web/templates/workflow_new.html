{% extends "base.html" %}
{% block title %}New workflow{% endblock %}
{% block content %}
<div class="mb-6">
  <h1 class="text-2xl font-semibold tracking-tight">New workflow</h1>
  <p class="text-sm text-muted-foreground">Starts in draft — add steps and transitions, then activate it.</p>
</div>

{% if error %}
<div class="alert mb-6" data-variant="destructive"><section>{{ error }}</section></div>
{% endif %}

<div class="card mx-auto max-w-lg" data-size="sm">
  <section>
    <form method="post" action="/{{ organization.slug }}/workflows" class="flex flex-col gap-4">
      <div role="group" class="field">
        <label for="workflow-name">Name</label>
        <input id="workflow-name" type="text" name="name" required>
      </div>
      <div role="group" class="field">
        <label for="workflow-description">Description</label>
        <input id="workflow-description" type="text" name="description">
      </div>
      <button type="submit" class="btn w-full">Create</button>
    </form>
  </section>
</div>
{% endblock %}
