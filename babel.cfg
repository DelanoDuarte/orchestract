# Babel message-extraction config. Templates are the only source of user-facing
# copy that needs translating (server responses are otherwise data). The i18n
# extension teaches the extractor about {% trans %} blocks in addition to the
# default gettext keywords (_/gettext/ngettext).
# Patterns are matched relative to the extraction root passed on the command
# line (app/web/templates), so this globs every template there.
[jinja2: **.html]
encoding = utf-8
extensions = jinja2.ext.i18n
