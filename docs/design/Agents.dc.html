<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css">
<script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer></script>
<style>
  :root{
    --background: oklch(0.16 0.016 175); --foreground: oklch(0.95 0.01 175);
    --card: oklch(0.205 0.018 175); --card-foreground: oklch(0.95 0.01 175);
    --muted: oklch(0.24 0.016 175); --muted-foreground: oklch(0.66 0.02 175);
    --border: oklch(1 0 0 / 10%); --input: oklch(1 0 0 / 14%); --ring: oklch(0.72 0.15 165 / 0.5);
    --primary: oklch(0.72 0.15 165); --primary-foreground: oklch(0.16 0.02 165);
    --secondary: oklch(0.24 0.016 175); --secondary-foreground: oklch(0.95 0.01 175);
    --destructive: oklch(0.62 0.19 25); --destructive-foreground: oklch(0.97 0.01 25);
    --radius: 0.75rem;
    --bg: var(--background); --fg: var(--foreground); --muted-fg: var(--muted-foreground);
    --primary-fg: var(--primary-foreground);
  }
  body{ margin:0; background:var(--background); background-image:radial-gradient(circle at 12% -10%, oklch(0.4 0.06 165 / 20%), transparent 55%); background-attachment:fixed; }
  .om-row{ transition:background-color .15s ease; }
</style>
</helmet>
<div style="max-width:1180px;margin:0 auto;padding:40px 28px 80px;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--fg)">
  <div style="margin-bottom:24px">
    <h1 style="margin:0;font-size:26px;font-weight:600;letter-spacing:-0.01em">Agents</h1>
    <p style="margin:6px 0 0;font-size:14px;color:var(--muted-fg)">Departments/participants that own steps in a workflow. Create as many as you need.</p>
  </div>

  <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
    <div style="margin-bottom:20px;display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius);border:1px solid oklch(0.5 0.15 25 / 0.4);background:oklch(0.68 0.19 25 / 0.12)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.19 25)" stroke-width="2" stroke-linecap="round"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z M9 9l6 6 M15 9l-6 6"></path></svg>
      <span style="font-size:13px">{{ errorText }}</span>
    </div>
  </sc-if>

  <div style="display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start">
    <div class="card" style="padding:0;overflow:hidden">
      <sc-if value="{{ hasAgents }}" hint-placeholder-val="{{ true }}">
        <div style="overflow-x:auto">
          <table class="table" style="width:100%;font-size:13px">
            <thead>
              <tr>
                <th style="text-align:left;color:var(--muted-foreground);font-size:11px;text-transform:uppercase;letter-spacing:0.03em">Name</th>
                <th style="text-align:left;color:var(--muted-foreground);font-size:11px;text-transform:uppercase;letter-spacing:0.03em">Description</th>
                <th style="text-align:left;color:var(--muted-foreground);font-size:11px;text-transform:uppercase;letter-spacing:0.03em">Steps owned</th>
                <th style="text-align:left;color:var(--muted-foreground);font-size:11px;text-transform:uppercase;letter-spacing:0.03em">Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <sc-for list="{{ agentRows }}" as="agent" hint-placeholder-count="5">
                <tr class="om-row" style="background:{{ agent.rowBg }}" style-hover="background:var(--muted)">
                  <td style="font-weight:500">{{ agent.name }}</td>
                  <td style="color:var(--muted-foreground)">{{ agent.description }}</td>
                  <td style="color:var(--muted-foreground)">{{ agent.stepCount }}</td>
                  <td>
                    <span class="badge" style="background:{{ agent.statusBg }};color:{{ agent.statusFg }}">{{ agent.statusLabel }}</span>
                  </td>
                  <td style="text-align:right">
                    <form onsubmit="{{ preventSubmit }}">
                      <button type="submit" class="btn" data-variant="outline" style="padding:5px 11px;font-size:12px">{{ agent.toggleLabel }}</button>
                    </form>
                  </td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
      </sc-if>
      <sc-if value="{{ noAgents }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:44px 0;color:var(--muted-foreground)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg>
          <p style="margin:0;font-size:13px">No agents yet.</p>
        </div>
      </sc-if>
    </div>

    <div class="card">
      <div style="padding:16px 18px;border-bottom:1px solid var(--border)">
        <h2 style="margin:0;font-size:15px;font-weight:600">New agent</h2>
        <p style="margin:4px 0 0;font-size:12.5px;color:var(--muted-foreground)">e.g. Legal, Finance, Compliance.</p>
      </div>
      <form onsubmit="{{ preventSubmit }}" style="padding:18px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;flex-direction:column;gap:5px">
          <label style="font-size:12px;font-weight:500;color:var(--muted-foreground)">Name</label>
          <input type="text" class="input" required="{{ true }}"></input>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <label style="font-size:12px;font-weight:500;color:var(--muted-foreground)">Description</label>
          <input type="text" class="input"></input>
        </div>
        <button type="submit" class="btn" style="width:100%">Create agent</button>
      </form>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{}, &quot;sampleState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;populated&quot;,&quot;tsType&quot;:&quot;'populated'|'empty'&quot;,&quot;options&quot;:[&quot;populated&quot;,&quot;empty&quot;],&quot;section&quot;:&quot;State&quot;}, &quot;errorBanner&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;}}">
const AGENTS = [
  { name:"Legal", description:"Reviews contract terms for risk and compliance.", stepCount:3, isActive:true },
  { name:"Counterparty", description:"External party negotiating terms.", stepCount:2, isActive:true },
  { name:"Finance", description:"Signs off on commercial terms and budget.", stepCount:1, isActive:true },
  { name:"Signatories", description:"Authorized to execute contracts.", stepCount:1, isActive:true },
  { name:"Contract Ops", description:"Monitors active contracts and renewals.", stepCount:3, isActive:false }
];

class Component extends DCLogic {
  preventSubmit(e) { e.preventDefault(); }
  renderVals() {
    const sampleState = this.props.sampleState ?? "populated";
    const agents = sampleState === "empty" ? [] : AGENTS;
    const zebra = (i) => i % 2 === 1 ? "var(--muted)" : "transparent";
    return {
      showError: this.props.errorBanner ?? false,
      errorText: "An agent with that name already exists.",
      hasAgents: agents.length > 0, noAgents: agents.length === 0,
      agentRows: agents.map((a, i) => ({
        ...a, rowBg: zebra(i),
        statusLabel: a.isActive ? "Active" : "Inactive",
        statusBg: a.isActive ? "oklch(0.72 0.15 165 / 0.16)" : "var(--muted)",
        statusFg: a.isActive ? "var(--primary)" : "var(--muted-fg)",
        toggleLabel: a.isActive ? "Deactivate" : "Activate"
      })),
      preventSubmit: this.preventSubmit
    };
  }
}

</script>
</body>
</html>
