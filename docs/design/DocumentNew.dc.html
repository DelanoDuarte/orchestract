<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css">
<script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js" defer></script>
<style>
  :root{
    --background: oklch(0.16 0.016 175); --foreground: oklch(0.95 0.01 175);
    --card: oklch(0.205 0.018 175); --card-foreground: oklch(0.95 0.01 175);
    --muted: oklch(0.24 0.016 175); --muted-foreground: oklch(0.66 0.02 175);
    --border: oklch(1 0 0 / 10%); --input: oklch(1 0 0 / 14%); --ring: oklch(0.72 0.15 165 / 0.5);
    --primary: oklch(0.72 0.15 165); --primary-foreground: oklch(0.16 0.02 165);
    --accent: oklch(0.78 0.14 70); --accent-foreground: oklch(0.2 0.03 70);
    --secondary: oklch(0.24 0.016 175); --secondary-foreground: oklch(0.95 0.01 175);
    --destructive: oklch(0.62 0.19 25); --destructive-foreground: oklch(0.97 0.01 25);
    --radius: 0.75rem;
    --bg: var(--background); --fg: var(--foreground); --muted-fg: var(--muted-foreground);
    --primary-fg: var(--primary-foreground);
  }
  body{ margin:0; background:var(--background); background-image:radial-gradient(circle at 12% -10%, oklch(0.4 0.06 165 / 20%), transparent 55%); background-attachment:fixed; }
  a.wf-opt{ text-decoration:none; }
</style>
</helmet>
<div style="max-width:640px;margin:0 auto;padding:40px 28px 80px;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--fg)">
  <div style="margin-bottom:24px">
    <h1 style="margin:0;font-size:26px;font-weight:600;letter-spacing:-0.01em">New document</h1>
    <p style="margin:6px 0 0;font-size:14px;color:var(--muted-fg)">Starts running through the workflow you pick immediately.</p>
  </div>

  <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
    <div style="margin-bottom:20px;display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius);border:1px solid oklch(0.5 0.15 25 / 0.4);background:oklch(0.68 0.19 25 / 0.12)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.19 25)" stroke-width="2" stroke-linecap="round"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z M9 9l6 6 M15 9l-6 6"></path></svg>
      <span style="font-size:13px">{{ errorText }}</span>
    </div>
  </sc-if>

  <div class="card" style="padding:24px">
    <sc-if value="{{ hasWorkflows }}" hint-placeholder-val="{{ true }}">
      <form onsubmit="{{ preventSubmit }}" style="display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;flex-direction:column;gap:5px">
          <label style="font-size:12px;font-weight:500;color:var(--muted-foreground)">Title</label>
          <input type="text" class="input" required="{{ true }}"></input>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div style="display:flex;flex-direction:column;gap:5px">
            <label style="font-size:12px;font-weight:500;color:var(--muted-foreground)">Type</label>
            <input type="text" class="input" required="{{ true }}" placeholder="e.g. NDA, MSA"></input>
          </div>
          <div style="display:flex;flex-direction:column;gap:5px">
            <label style="font-size:12px;font-weight:500;color:var(--muted-foreground)">Your name</label>
            <input type="text" class="input" required="{{ true }}"></input>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <label style="font-size:12px;font-weight:500;color:var(--muted-foreground)">Description</label>
          <input type="text" class="input"></input>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label style="font-size:12px;font-weight:500;color:var(--muted-foreground)">Workflow</label>
          <sc-for list="{{ workflowOptions }}" as="wf" hint-placeholder-count="3">
            <label style="display:flex;align-items:center;gap:10px;border:1px solid {{ wf.border }};background:{{ wf.bg }};border-radius:8px;padding:10px 12px;cursor:pointer;transition:border-color .15s">
              <input type="radio" name="workflow" value="{{ wf.id }}"></input>
              <span style="flex:1">
                <span style="display:block;font-size:13.5px;font-weight:500">{{ wf.name }}</span>
                <span style="display:block;font-size:11.5px;color:var(--muted-foreground)">{{ wf.stepCount }} steps</span>
              </span>
            </label>
          </sc-for>
        </div>
        <button type="submit" class="btn" style="width:100%;margin-top:4px">Create &amp; start workflow</button>
      </form>
    </sc-if>
    <sc-if value="{{ noWorkflows }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 0;text-align:center;color:var(--muted-foreground)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"></path></svg>
        <p style="margin:0;font-size:13px">No active workflows yet — <a href="#" class="wf-opt" style="color:var(--accent);text-decoration:underline">activate one first</a>.</p>
      </div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{}, &quot;sampleState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;populated&quot;,&quot;tsType&quot;:&quot;'populated'|'no_workflows'&quot;,&quot;options&quot;:[&quot;populated&quot;,&quot;no_workflows&quot;],&quot;section&quot;:&quot;State&quot;}, &quot;errorBanner&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;}}">
const WORKFLOWS = [
  { id:1, name:"Master Services Agreement", stepCount:8 },
  { id:2, name:"NDA — Standard", stepCount:3 }
];

class Component extends DCLogic {
  preventSubmit(e) { e.preventDefault(); }
  renderVals() {
    const sampleState = this.props.sampleState ?? "populated";
    const workflows = sampleState === "no_workflows" ? [] : WORKFLOWS;
    return {
      showError: this.props.errorBanner ?? false,
      errorText: "Please fill in every required field before continuing.",
      hasWorkflows: workflows.length > 0, noWorkflows: workflows.length === 0,
      workflowOptions: workflows.map((wf, i) => ({
        ...wf,
        border: i === 0 ? "var(--primary)" : "var(--border)",
        bg: i === 0 ? "oklch(0.72 0.15 165 / 0.08)" : "transparent"
      })),
      preventSubmit: this.preventSubmit
    };
  }
}

</script>
</body>
</html>
